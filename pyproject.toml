[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-pandemic-impact-analytics"
version = "1.0.0"
description = "Reproducible Python analytics pipeline for global COVID-19 impact analysis."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
